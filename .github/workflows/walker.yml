# Builds the OAU Walk Android app on GitHub, so nobody needs Android tools on their own computer.
# The newest test build is always at the "walker-test" release of this repository.
name: Build OAU Walk

on:
  workflow_dispatch:
  push:
    paths:
      - "android-walker/**"
      - ".github/workflows/walker.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build the app
        run: |
          set -o pipefail
          gradle --no-daemon -p android-walker assembleRelease 2>&1 | tee build.log
      - name: Publish the test build
        run: |
          cp android-walker/app/build/outputs/apk/release/app-release.apk oau-walk.apk
          gh release delete walker-test --yes --cleanup-tag || true
          gh release create walker-test oau-walk.apk --prerelease --title "OAU Walk test build" --notes "Test build of the OAU Walk app, from ${GITHUB_SHA::7}." --target "$GITHUB_SHA"
      - name: Publish the error log if the build failed
        if: failure()
        run: |
          gh release delete walker-log --yes --cleanup-tag || true
          gh release create walker-log build.log --prerelease --title "OAU Walk build log" --notes "The last failed build." --target "$GITHUB_SHA"
