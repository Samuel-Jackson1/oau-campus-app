<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000a5c">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="vendor/leaflet.css"><link rel="stylesheet" href="vendor/fonts.css"><link rel="stylesheet" href="style.css"><title>OAU Navigator</title></head>
<body>
<header><button id="back" hidden aria-label="Back"></button><span class="crest"><img src="icons/oau-crest.webp" alt="OAU crest" width="34" height="31"></span><h1><span>OAU</span> <span>Navigator</span></h1><button id="themebtn" role="switch" aria-checked="false"><span class="knob"></span><i class="tsun"></i><i class="tmoon"></i></button><button id="sosbtn" aria-label="Emergency"><b>SOS</b></button><button id="langbtn" aria-label="Language"></button></header>
<div id="devbar" hidden>DEV: sample data in use. Replace data/*.json, photos and audio, then this bar disappears. See DEV_NOTES.md</div>
<noscript><p style="padding:1rem;font-size:1.1rem">This app needs JavaScript. Please open the file or link in your phone browser (Chrome or Safari), not in a chat or file preview.</p></noscript>
<p id="status" role="status"></p>
<main>
<section id="lang" class="screen" hidden>
<div class="land">
<div class="lbrand"><span class="crest"><img src="icons/oau-crest.webp" alt="OAU crest" width="34" height="31"></span><b class="stack"><span>OAU</span> <span>Navigator</span></b></div>
<div class="orbs">
<div class="stage" aria-hidden="true"><i class="orb ring"></i><i class="orb pin3d"><i></i></i><i class="orb cube"></i></div>
<button class="blob g" data-lang="en"><span>Welcome!</span><small>English</small></button>
<button class="blob y" data-lang="yo"><span>Ẹ káàbọ̀!</span><small>Yorùbá</small></button>
<button class="blob c" data-lang="pcm"><span>How far?</span><small>Pidgin</small></button>
</div>
<h2 class="lhead" data-t="tagline"></h2>
<p class="lsub" data-t="tagsub"></p>
<div class="lrow" role="group" aria-label="Language"><button data-lang="en">English</button><button data-lang="yo">Yorùbá</button><button data-lang="pcm">Pidgin</button></div>
<p id="firstopen" class="lnote" data-t="firstopen"></p>
</div>
</section>
<section id="where" class="screen" hidden>
<p id="going" class="going" hidden></p>
<h2 class="bigq" data-t="where"></h2>
<p class="meta" data-t="wheresub"></p>
<button id="gps" class="gpsbtn"></button>
<p id="gpsmsg" class="meta ctr" role="status"></p>
<h3 class="seeh" data-t="seeplace"></h3>
<div class="qwrap"><input id="wq" class="plainq" type="search" autocomplete="off" enterkeyhint="search"><button id="wqx" type="button" hidden>&times;</button></div>
<ul id="wlist" class="cards"></ul>
<button id="wskip" class="linkbtn" data-t="skip"></button>
</section>
<section id="pager" class="screen" hidden>
<div id="pages">
<section id="find" class="page">
<button id="fromcard" class="fromcard"></button>
<h2 class="ptitle" data-t="whereto"></h2>
<div id="qrow"><div class="beam"><i class="ic" data-ico="map-pin"></i><input id="q" type="search" autocomplete="off" enterkeyhint="search"><i class="live" aria-hidden="true"></i><button id="qx" type="button" hidden>&times;</button></div></div>
<button id="freshcard" class="fresh"></button>
<div id="recent" hidden><div class="rhead"><b data-t="recent"></b><button id="rclear" data-t="clear"></button></div><div id="rchips"></div></div><button id="catpill" hidden></button>
<div id="cats" class="grid"></div><p id="closest" class="meta" hidden></p><ul id="list" class="cards" hidden></ul>
</section>
<section id="lessons" class="page"><h2 class="ptitle" data-t="lessons"></h2><div id="topics" class="grid"></div></section>
<section id="emergency" class="page"><h2 class="ptitle" data-t="sos"></h2>
<div id="ecats" class="grid"></div><div id="ebody"></div><p class="note" data-t="note"></p><button class="secondary" data-go="lessons" data-t="lessons" data-i="book-open"></button>
</section>
</div>
<nav id="tabs"><button data-page="find"><i data-ico="map-pin"></i><b data-t="tfind"></b></button><button data-page="lessons"><i data-ico="shield-check"></i><b data-t="tsafe"></b></button><button data-page="emergency" class="sos"><i data-ico="siren"></i><b data-t="sos"></b></button></nav>
</section>

<section id="nav" class="screen" hidden>
<div id="summary"></div>
<div id="scards"></div>
<div id="dots"></div>
<div class="row3"><button id="prev" class="secondary" aria-label="Previous"></button><button id="next" class="secondary" aria-label="Next"></button></div>
<details id="mapbox" open><summary id="mapbtn"></summary><div id="mapwrap"><div id="map" role="region" aria-label="Map"></div><span id="youtag" hidden></span><p id="mapnote" hidden></p><button id="locate" aria-pressed="false"></button></div></details>
<p class="meta ctr" style="font-size:.8rem">Routes follow roads from OpenStreetMap &middot; &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap contributors</a></p>
</section>

<section id="freshers" class="screen" hidden><h2 data-t="fresh"></h2><p class="meta" data-t="freshsub"></p><div id="fprog"><i></i></div><p id="fcount" class="meta"></p>
<ol id="fsteps"></ol><p class="tbc" data-t="fdraft"></p></section>
<section id="slides" class="screen" hidden><h2 id="ltitle" class="ctr"></h2><div id="ldeck" class="deck"></div><p id="ldraft" class="note ctr"></p></section>

</main>
<div id="viewer" hidden role="dialog" aria-label="Photo"><img alt=""><button id="vclose" aria-label="Close">&times;</button></div>
<script src="vendor/leaflet.js"></script><script src="vendor/icons.js"></script><script src="category-icons.js"></script><script src="route.js"></script><script src="app.js"></script>
</body></html>
