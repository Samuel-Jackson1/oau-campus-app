<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b5d3b">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="vendor/leaflet.css"><link rel="stylesheet" href="vendor/fonts.css"><link rel="stylesheet" href="style.css"><title>OAU Navigator</title></head>
<body>
<header><button id="back" hidden aria-label="Back"></button><h1>OAU Navigator</h1><button id="themebtn" aria-label="Light or dark"></button><button id="langbtn" aria-label="Language"></button></header>
<div id="devbar" hidden>DEV: sample data in use. Replace data/*.json, photos and audio, then this bar disappears. See DEV_NOTES.md</div>
<noscript><p style="padding:1rem;font-size:1.1rem">This app needs JavaScript. Please open the file or link in your phone browser (Chrome or Safari), not in a chat or file preview.</p></noscript>
<p id="status" role="status"></p>
<main>
<section id="lang" class="screen" hidden>
<p id="firstopen" class="note ctr" data-t="firstopen"></p>
<button class="tile" data-lang="en"><b>English</b></button><button class="tile" data-lang="yo"><b>Yorùbá</b></button><button class="tile" data-lang="pcm"><b>Pidgin</b></button>
</section>
<section id="home" class="screen" hidden>
<button class="tile" data-go="find"><i data-ico="map-pin"></i><b data-t="find"></b></button>
<button class="tile" data-go="lessons"><i data-ico="book-open"></i><b data-t="lessons"></b></button>
<button class="tile sos" data-go="emergency"><i data-ico="siren"></i><b data-t="sos"></b></button>
</section>
<section id="find" class="screen" hidden>
<div id="qrow"><input id="q" type="search" autocomplete="off"><button id="all" aria-pressed="false"></button></div><button id="catpill" hidden></button>
<div id="cats" class="grid"></div><ul id="list" class="cards" hidden></ul>
</section>
<section id="start" class="screen" hidden>
<div class="dest"><i class="mk" id="sico"></i><b id="sname"></b></div><div id="spic" class="pic"></div><p id="slm" class="meta ctr"></p>
<button id="here" class="secondary" data-t="here" data-i="locate-fixed"></button>
<h2 data-t="where"></h2><ul id="starts" class="cards"></ul>
</section>
<section id="nav" class="screen" hidden>
<div id="dots"></div>
<div id="big"><div id="bigico"></div></div>
<div id="npic" class="pic"></div><div id="stepText"></div>
<p class="meta ctr" style="font-size:.8rem">Routes follow roads from OpenStreetMap &middot; &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap contributors</a></p>
<div class="row3"><button id="prev" class="secondary" aria-label="Previous"></button><button id="next" class="secondary" aria-label="Next"></button></div>
<details id="mapbox"><summary id="mapbtn"></summary><div id="map" role="region" aria-label="Map"></div></details>
</section>
<section id="lessons" class="screen" hidden><div id="topics" class="grid"></div></section>
<section id="slides" class="screen" hidden><h2 id="ltitle" class="ctr"></h2><div id="ldots"></div><div id="embc"></div><p id="lcount" class="meta ctr"></p>
<div class="row3"><button id="lprev" class="secondary" aria-label="Previous"></button><button id="lnext" class="secondary" aria-label="Next"></button></div><p id="ldraft" class="tbc"></p></section>
<section id="emergency" class="screen" hidden>
<div id="ecats" class="grid"></div><div id="ebody"></div><p class="note" data-t="note"></p><button class="secondary" data-go="lessons" data-t="lessons" data-i="book-open"></button>
</section>
</main>
<script src="vendor/leaflet.js"></script><script src="vendor/icons.js"></script><script src="category-icons.js"></script><script src="route.js"></script><script src="app.js"></script>
</body></html>
